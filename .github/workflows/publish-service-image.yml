name: publish-service-image

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      ref:
        required: false
        type: string
        default: ''
      promote-staging:
        required: false
        type: boolean
        default: true
    outputs:
      stag-tag:
        value: ${{ jobs.publish.outputs.stag-tag }}

permissions:
  contents: read

jobs:
  publish:
    name: publish ${{ inputs.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      stag-tag: ${{ steps.tags.outputs.stag-tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Compute tags
        id: tags
        run: |
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          BUILD_STAMP="$(date -u +%Y%m%d%H%M%S)"
          IMAGE="${{ secrets.HARBOR_REGISTRY }}/orchid/${{ inputs.service }}"
          echo "tags=${IMAGE}:sha-${SHORT_SHA},${IMAGE}:stag-${BUILD_STAMP}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "stag-tag=stag-${BUILD_STAMP}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Login to Harbor
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,scope=${{ inputs.service }},mode=min,ignore-error=true
          provenance: false

      - name: Summary
        run: echo "Published staging tag ${{ steps.tags.outputs.stag-tag }}" >> "$GITHUB_STEP_SUMMARY"

  promote-staging:
    name: promote ${{ inputs.service }} to staging
    needs: publish
    if: ${{ inputs.promote-staging }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: orchid-staging-tag-promotion
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set staging image tag
        shell: pwsh
        run: |
          $Arguments = @{
              KustomizationPath = 'deploy/k8s/overlays/staging/kustomization.yaml'
              Image = 'harbor.hanul.botanicsoft.com/orchid/${{ inputs.service }}'
              Tag = '${{ needs.publish.outputs.stag-tag }}'
          }
          ./deploy/scripts/Set-OverlayImageTag.ps1 @Arguments

      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo "No tag change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "ops(image): update orchid staging ${{ inputs.service }} -> ${{ needs.publish.outputs.stag-tag }}"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
          done
          echo "push failed after 3 attempts" >&2
          exit 1
