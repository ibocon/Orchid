name: publish-clipboard-image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (branch, tag, or full SHA). Defaults to the dispatch ref.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: publish-clipboard-${{ github.event.inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    uses: ./.github/workflows/publish-service-image.yml
    with:
      service: clipboard
      dockerfile: src/Service/Clipboard/Dockerfile
      ref: ${{ github.event.inputs.ref }}
    secrets: inherit
