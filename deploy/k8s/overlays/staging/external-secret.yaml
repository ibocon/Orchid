apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: orchid-api-gateway-external-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: orchid-openbao
  target:
    name: orchid-api-gateway-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: app/stag/orchid/api-gateway
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: orchid-clipboard-external-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: orchid-openbao
  target:
    name: orchid-clipboard-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: app/stag/orchid/clipboard
