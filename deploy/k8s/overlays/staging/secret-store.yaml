apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: orchid-openbao
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: orchid-staging
          serviceAccountRef:
            name: orchid-eso
