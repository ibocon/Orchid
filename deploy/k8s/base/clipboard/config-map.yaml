apiVersion: v1
kind: ConfigMap
metadata:
  name: orchid-clipboard-config-map
  labels:
    app.kubernetes.io/name: orchid-clipboard
    app.kubernetes.io/part-of: orchid
data:
  appsettings.json: |
    {
      "Logging": {
        "LogLevel": {
          "Default": "Information",
          "Microsoft.AspNetCore": "Warning"
        }
      },
      "AllowedHosts": "*"
    }
