apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchid-clipboard
  labels:
    app.kubernetes.io/name: orchid-clipboard
    app.kubernetes.io/part-of: orchid
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orchid-clipboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orchid-clipboard
        app.kubernetes.io/part-of: orchid
    spec:
      imagePullSecrets:
        - name: harbor-registry
      containers:
        - name: clipboard
          image: harbor.hanul.botanicsoft.com/orchid/clipboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
          envFrom:
            - secretRef:
                name: orchid-clipboard-secret
          volumeMounts:
            - name: app-settings
              mountPath: /app/appsettings.json
              subPath: appsettings.json
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: app-settings
          configMap:
            name: orchid-clipboard-config-map
