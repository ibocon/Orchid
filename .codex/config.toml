model_verbosity = "low"
model_reasoning_summary = "concise"
[agents]
max_threads = 4
max_depth = 1
interrupt_message = true

[mcp_servers.aspire]
command = "node"
cwd = ".."
args = [
    "lib/Garden.Harness/src/agents/mcp/mcp-stdio-supervisor.mjs",
    "--lazy",
    "aspire",
    "--",
    "aspire",
    "agent",
    "mcp",
]

[mcp_servers.docker]
command = "docker"
args = [
    "mcp",
    "gateway",
    "run",
]

[mcp_servers.kubernetes]
command = "node"
cwd = ".."
args = [
    "lib/Garden.Harness/src/agents/mcp/mcp-stdio-supervisor.mjs",
    "--lazy",
    "kubernetes",
    "--",
    "pwsh",
    "-NoProfile",
    "-ExecutionPolicy",
    "Bypass",
    "-File",
    "lib/Garden.Harness/src/agents/mcp/Invoke-KubernetesMcpServer.ps1",
]
startup_timeout_sec = 120

[mcp_servers.kubernetes.env]
KUBECONFIG = "${env:KUBECONFIG}"
ALLOW_ONLY_NON_DESTRUCTIVE_TOOLS = "true"

[mcp_servers.grafana]
command = "node"
cwd = ".."
args = [
    "lib/Garden.Harness/src/agents/mcp/mcp-stdio-supervisor.mjs",
    "--lazy",
    "grafana",
    "--",
    "pwsh",
    "-NoProfile",
    "-ExecutionPolicy",
    "Bypass",
    "-File",
    "lib/Garden.Harness/src/agents/mcp/Invoke-GrafanaMcpServer.ps1",
]
startup_timeout_sec = 300

[mcp_servers.prometheus]
command = "node"
cwd = ".."
args = [
    "lib/Garden.Harness/src/agents/mcp/mcp-stdio-supervisor.mjs",
    "--lazy",
    "prometheus",
    "--",
    "pwsh",
    "-NoProfile",
    "-ExecutionPolicy",
    "Bypass",
    "-File",
    "lib/Garden.Harness/src/agents/mcp/Invoke-PrometheusMcpServer.ps1",
]
startup_timeout_sec = 300

[mcp_servers.prometheus.env]
KUBECONFIG = "${env:KUBECONFIG}"

[mcp_servers.playwright]
command = "node"
cwd = ".."
args = [
    "lib/Garden.Harness/src/agents/mcp/mcp-stdio-supervisor.mjs",
    "--lazy",
    "playwright",
    "--",
    "pwsh",
    "-NoProfile",
    "-ExecutionPolicy",
    "Bypass",
    "-File",
    "lib/Garden.Harness/src/agents/mcp/Invoke-PlaywrightMcpServer.ps1",
    "-Channel",
    "edge-debug",
]

[mcp_servers.playwright-webview2]
command = "node"
cwd = ".."
args = [
    "lib/Garden.Harness/src/agents/mcp/mcp-stdio-supervisor.mjs",
    "--lazy",
    "playwright-webview2",
    "--",
    "pwsh",
    "-NoProfile",
    "-ExecutionPolicy",
    "Bypass",
    "-File",
    "lib/Garden.Harness/src/agents/mcp/Invoke-PlaywrightMcpServer.ps1",
    "-Channel",
    "webview2",
]

[mcp_servers.figma]
url = "https://mcp.figma.com/mcp"

